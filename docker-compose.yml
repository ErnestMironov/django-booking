services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
